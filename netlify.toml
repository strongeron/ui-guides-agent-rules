[build]
  command = "npm run build"
  publish = "dist"

# Agent endpoints must fail loudly, and these rules must stay ABOVE the SPA fallback —
# Netlify applies the first matching redirect. Without them a typo'd rule id falls
# through to index.html and returns 200 with 7 KB of React shell, which an agent then
# tries to parse as a rule. Netlify still serves existing static files before applying
# any redirect, so every real payload wins and only wrong paths reach these.
#
# Forward-compatible with the planned HTML routes at /principles/<id>: those will be
# prerendered files, so they will be served directly, and an unknown id should 404 there
# too rather than rendering an empty app.
[[redirects]]
  from = "/principles/*"
  to = "/agent-404.txt"
  status = 404

[[redirects]]
  from = "/categories/*"
  to = "/agent-404.txt"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Agent discovery over HTTP. A headless fetcher never parses the <head>, so the
# <link rel="alternate"> tags in index.html are invisible to it — the same pointer has
# to exist as a response header.
#
# type is text/plain because that is what Netlify serves for .txt, and it needs to stay
# that way: text/markdown makes browsers download the file, and the footer links a human
# to llms-full.txt. The payload is Markdown either way.
[[headers]]
  for = "/*"
  [headers.values]
    Link = '''</llms-full.txt>; rel="alternate"; type="text/plain"; title="Full rule corpus", </llms.txt>; rel="alternate"; type="text/plain"; title="LLM index", <https://glebstroganov.com>; rel="author"'''

# The demo video and poster are meant to be embedded and fetched from
# elsewhere (README, social cards), so allow cross-origin reads.
[[headers]]
  for = "/media/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000, immutable"
